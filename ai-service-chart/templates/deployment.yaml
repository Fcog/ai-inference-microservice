apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: ai-service
spec:
  replicas: {{ .Values.replicaCount }} 
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      containers:
        - name: ai-node-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
          env:
            - name: AI_PROVIDER
              value: "mock"
            - name: OPENAI_API_KEY
              value: ""
            - name: ANTHROPIC_API_KEY
              value: ""
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-5"
            - name: REDIS_URL
              value: "redis://my-cache-redis-master:6379"
          # MLOps focus: Kubernetes monitors if your AI model crashes or locks up
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service-loadbalancer
spec:
  type: LoadBalancer # Balances traffic across your running AI pods
  selector:
    app: {{ .Release.Name }}-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
