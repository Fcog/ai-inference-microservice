name: CI/CD AI Inference Service Pipeline

# Trigger the workflow only when a PR is merged into the main branch
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./services/ai-inference/app/package-lock.json"

      - name: Install & Test Application
        run: |
          cd services/ai-inference/app
          npm ci
          npm run test --if-present

  # Node under QEMU crashes with SIGILL (exit 132) during npm ci on emulated
  # arm64. Build each platform on a runner of that architecture, then publish
  # one manifest that contains both.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-inference/app
          file: ./services/ai-inference/app/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=fcog/ai-inference,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "fcog/ai-inference:${{ github.sha }}" \
            -t fcog/ai-inference:latest \
            $(printf 'fcog/ai-inference@sha256:%s ' *)

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Helm Chart Image Tag & Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' ./services/ai-inference/chart/values-dev.yaml
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' ./services/ai-inference/chart/values-prod.yaml

          git add ./services/ai-inference/chart/values-dev.yaml ./services/ai-inference/chart/values-prod.yaml
          git commit -m "chore(gitops): automated image tag update to ${{ github.sha }} [skip ci]"
          git push origin main
