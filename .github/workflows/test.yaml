name: Test

# Feature-branch pushes and newly opened pull requests. Merges to main are
# tested by the deploy workflow before the image is built.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types:
      - opened

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./services/ai-inference/app/package-lock.json"

      - name: Install & Test Application
        run: |
          cd services/ai-inference/app
          npm ci
          npm test
