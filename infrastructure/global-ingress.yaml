apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-microservices-ingress
  namespace: default
  annotations:
    # Strips the '/api' routing segment before passing traffic to app.ts
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: my-local-ai-service.com # Your designated local portfolio test domain
      http:
        paths:
          # 🤖 ROUTE 1: Routes to your original AI Inference application
          - path: /api/?(.*) # Intercepts all traffic matching http://my-local-ai-service.com
            pathType: ImplementationSpecific
            backend:
              service:
                name: my-ai-app-dev-service # Forwards internally to your ClusterIP app service
                port:
                  number: 80
          # 📊 ROUTE 2: Routes to your brand-new Data Processor application
          - path: /processor/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: my-processor-dev-processor-service # Target metadata name of your processor service
                port:
                  number: 80
