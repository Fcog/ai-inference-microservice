apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200" # Your Vault address
      path: "secret"
      version: "v2"
      auth:
        # Authentication method (Token, Kubernetes Auth, AppRole, etc.)
        tokenSecretRef:
          name: "vault-token" # Points to the K8s token secret from Step 3
          key: "token"
