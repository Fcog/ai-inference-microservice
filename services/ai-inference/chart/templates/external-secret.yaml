apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service-secure-vault
spec:
  refreshInterval: "1h" # Automatically updates the secret if it changes in Vault!
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ai-app-runtime-secrets # This is the name of the K8s Secret that will be created
    creationPolicy: Owner
  # --- THE BULK SECRETS MAPPING ALTERNATIVE ---
  dataFrom:
    - extract:
        key: ai-service-credentials # Grabs EVERYTHING stored at this Vault secret path at once
