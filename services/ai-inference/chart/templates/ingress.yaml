apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 🧠 Crucial: Strips the '/api' routing segment before passing traffic to app.ts
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: my-local-ai-service.com # Your designated local portfolio test domain
    http:
      paths:
      - path: /api/?(.*) # Intercepts all traffic matching http://my-local-ai-service.com
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Release.Name }}-service # Forwards internally to your ClusterIP app service
            port:
              number: 80
